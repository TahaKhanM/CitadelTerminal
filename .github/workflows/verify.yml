name: Verify simulation and evaluation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.24,<3'
      - run: python -m unittest discover -s tests -p test_evaluation.py -v
      - run: python tests/test_strategy_regressions.py -v
      - run: ALGO_UNDER_TEST=oracle_pure python tests/test_strategy_regressions.py -v
      - run: python -m algos.athena.sim.tests.test_float32_propagation
      - run: python -m algos.athena.sim.fuzz --n 240 --seed 42
      - run: python tools/smoke_algo.py algos/smart_oracle_F2
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --lib --tests
        working-directory: algos/athena/sim_rs
